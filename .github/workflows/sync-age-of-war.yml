name: Sync Age of War release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Synchronize latest stable release
        run: python .github/scripts/sync_age_of_war_release.py
      - name: Commit catalog updates
        run: |
          if git diff --quiet -- catalog.json data/catalog.json; then
            echo "Catalogs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json data/catalog.json
          git commit -m "Update Age of War release metadata"
          git push
